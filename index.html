<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17C26E">
<meta name="description" content="Sistema comercial y de marketing — línea de nutrición clínica Bi¹.">
<title>NÚCLEO — Sistema Comercial · Infinity Nutrición</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css?v=13">
</head>
<body>

<!-- Login (solo con base de datos conectada) -->
<div class="overlay hide" id="login">
  <form class="card login-card" id="loginForm">
    <div class="brand" style="padding-bottom:16px"><b>NÚCLEO</b><span>Infinity Nutrición</span></div>
    <div class="fld"><label>Email</label><input type="email" id="lEmail" required autocomplete="username"></div>
    <div class="fld"><label>Contraseña</label><input type="password" id="lPass" required autocomplete="current-password"></div>
    <p class="err" id="loginErr"></p>
    <button class="btn pri" id="loginBtn" style="width:100%;margin-top:14px">Entrar</button>
    <p class="hint" style="margin-top:12px">Acceso solo para el equipo.</p>
  </form>
</div>

<!-- Barra superior: solo en celular -->
<header class="mtop">
  <button class="icobtn" id="burger" aria-label="Menú">☰</button>
  <div class="brand mini-brand"><b>NÚCLEO</b><span>Infinity Nutrición</span></div>
  <button class="icobtn js-ayuda" aria-label="Ayuda">?</button>
</header>
<div class="backdrop" id="backdrop"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>NÚCLEO</b><span>Infinity Nutrición</span></div>
    <button class="nav on" data-v="panel"><span class="ic">◧</span>Panel</button>
    <button class="nav" data-v="ventas"><span class="ic">▤</span>Ventas</button>
    <button class="nav" data-v="cuentas"><span class="ic">◎</span>Cuentas</button>
    <button class="nav" data-v="catalogo"><span class="ic">▩</span>Catálogo</button>
    <button class="nav" data-v="stock"><span class="ic">▦</span>Stock<span class="pill" id="pillStock" style="display:none">0</span></button>
    <button class="nav" data-v="tienda"><span class="ic">◍</span>Tienda online</button>
    <button class="nav" data-v="acciones"><span class="ic">◈</span>Acciones</button>
    <button class="nav" data-v="base"><span class="ic">☰</span>Base de datos</button>
    <button class="nav" data-v="instituciones"><span class="ic">⌂</span>Instituciones</button>
    <button class="nav" data-v="reportes"><span class="ic">↧</span>Reportes</button>
    <div class="side-foot">
      <button class="nav js-ayuda"><span class="ic">?</span>Ayuda y visita guiada</button>
      <div class="aval"><span>Una línea de</span><img src="assets/logo-infinity.png" alt="Infinity Pharma"></div>
      <div class="modo" id="modo"><span class="dot"></span>Solo en este equipo</div>
      <button class="linkbtn hide" id="logout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <p class="kicker">Nutrición clínica</p>
        <h1 id="vTitle">Panel</h1>
        <div class="acento"></div>
        <p id="vSub">Vista general de la línea</p>
      </div>
      <div class="sp">
        <select class="btn" id="periodo" aria-label="Mes"></select>
        <button class="btn icobtn js-ayuda desk" aria-label="Ayuda">?</button>
        <button class="btn pri js-venta desk">+ Cargar venta</button>
      </div>
    </div>
    <div id="views"></div>
  </main>
</div>

<!-- Botón flotante: solo en celular -->
<button class="fab js-venta" aria-label="Cargar venta">+</button>

<div class="tip" id="tip"></div>
<dialog id="dlg"></dialog>
<input type="file" id="csvIn" accept=".csv,text/csv" class="hide">
<input type="file" id="xlsStock" accept=".xlsx,.xls" class="hide">
<input type="file" id="xlsVentas" accept=".xlsx,.xls" class="hide">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/vendor/xlsx.full.min.js?v=13"></script>
<script src="assets/config.js?v=13"></script>
<script src="assets/data.js?v=13"></script>
<script src="assets/sheets.js?v=13"></script>
<script src="assets/store.js?v=13"></script>
<script src="assets/ux.js?v=13"></script>
<script src="assets/import.js?v=13"></script>
<script src="assets/app.js?v=13"></script>
</body>
</html>
